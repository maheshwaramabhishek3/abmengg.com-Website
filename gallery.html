<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vishwakarma ABM Engineering Group - Gallery</title>
  <link rel="icon" type="image/png" href="Images/graphical logo.png" />
  <script src="images-data.js"></script>
  <script src="common-header-footer.js"></script>
  <link rel="stylesheet" href="common-styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="contact-popup.js"></script>
  <style>
    .section h2 {
      text-align: center;
      padding: 15px 30px;
      font-size: 32px;
      color: #fff;
      text-transform: uppercase;
      margin: 30px auto;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      display: inline-block;
      position: relative;
      font-weight: 600;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }
    
    .section h2:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #243B55, #141E30);
    }

    .section {
      text-align: center;
      padding: 20px 0;
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 100%;
      margin: 0 auto;
    }

    .image-container {
      position: relative;
      width: 100%;
      padding-top: 75%; /* 4:3 Aspect Ratio */
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      background: rgba(0,0,0,0.05);
    }

    .image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .image-container:hover img {
      transform: scale(1.05);
    }

    .image-container::after {
      content: '🔍';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 24px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 50%;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .image-container:hover::after {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Fullscreen Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      overflow: hidden;
    }

    .modal-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 95%;
      max-height: 90vh;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-prev,
    .modal-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .modal-prev { left: 20px; }
    .modal-next { right: 20px; }

    .modal-prev:hover,
    .modal-next:hover {
      background: rgba(0,0,0,0.8);
    }

    @media screen and (max-width: 768px) {
      .section h2 {
        font-size: 24px;
        padding: 12px 20px;
        letter-spacing: 1px;
      }

      .images-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
        padding: 15px;
      }
    }

    @media screen and (max-width: 480px) {
      .section h2 {
        font-size: 20px;
        padding: 10px 15px;
      }

      .images-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
        padding: 10px;
      }

      .insta-button {
        padding: 10px 20px !important;
        font-size: 0.9em !important;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div id="gallery-sections"></div>
  <div id="footer-placeholder"></div>
  <script src="common-header-footer.js"></script>
  <!-- Modal for fullscreen preview -->
  <div id="imageModal" class="modal">
    <span class="modal-close">&times;</span>
    <span class="modal-prev">&#10094;</span>
    <span class="modal-next">&#10095;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="">
    </div>
  </div>

  <script>
    // Inject header and footer into placeholders, then render gallery
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof injectHeaderFooter === 'function') {
        injectHeaderFooter('header-placeholder', 'footer-placeholder');
      }

      // Modal functionality
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      const closeBtn = document.getElementsByClassName('modal-close')[0];
      const prevBtn = document.getElementsByClassName('modal-prev')[0];
      const nextBtn = document.getElementsByClassName('modal-next')[0];
      let currentImageIndex = 0;
      let currentImages = [];

      function openModal(images, index) {
        modal.style.display = 'block';
        currentImages = images;
        currentImageIndex = index;
        modalImg.src = images[index];
        updateNavigationButtons();
      }

      function updateNavigationButtons() {
        prevBtn.style.display = currentImageIndex > 0 ? 'block' : 'none';
        nextBtn.style.display = currentImageIndex < currentImages.length - 1 ? 'block' : 'none';
      }

      closeBtn.onclick = function() {
        modal.style.display = 'none';
      }

      prevBtn.onclick = function() {
        if (currentImageIndex > 0) {
          currentImageIndex--;
          modalImg.src = currentImages[currentImageIndex];
          updateNavigationButtons();
        }
      }

      nextBtn.onclick = function() {
        if (currentImageIndex < currentImages.length - 1) {
          currentImageIndex++;
          modalImg.src = currentImages[currentImageIndex];
          updateNavigationButtons();
        }
      }

      // Close modal when clicking outside the image
      modal.onclick = function(e) {
        if (e.target === modal) {
          modal.style.display = 'none';
        }
      }

      // Keyboard navigation
      document.addEventListener('keydown', function(e) {
        if (modal.style.display === 'block') {
          if (e.key === 'ArrowLeft' && currentImageIndex > 0) {
            prevBtn.click();
          } else if (e.key === 'ArrowRight' && currentImageIndex < currentImages.length - 1) {
            nextBtn.click();
          } else if (e.key === 'Escape') {
            modal.style.display = 'none';
          }
        }
      });

      function renderGallerySection(title, images, altPrefix) {
        const section = document.createElement('div');
        section.className = 'section';
        const h2 = document.createElement('h2');
        h2.textContent = title;
        section.appendChild(h2);
        
        const grid = document.createElement('div');
        grid.className = 'images-grid';
        
        images.forEach((src, i) => {
          const container = document.createElement('div');
          container.className = 'image-container';
          
          const img = document.createElement('img');
          img.src = src;
          img.alt = `${altPrefix} ${i + 1}`;
          
          container.appendChild(img);
          container.onclick = () => openModal(images, i);
          
          grid.appendChild(container);
        });
        section.appendChild(grid);

        // Add Instagram button after the photos for all sections
        // Create Instagram link styled as a button
        const instaLink = document.createElement('a');
        // Set different Instagram links and text based on section
        if (title === 'Structural Designing') {
            instaLink.href = 'https://www.instagram.com/structural_engineering_india/#';
        } else if (title === 'Photos ABMS') {
            instaLink.href = 'https://www.instagram.com/abm_surveyors/#';
        } else {
            instaLink.href = 'https://www.instagram.com/abm_architects_and_engineers/';
        }
        instaLink.target = '_blank';
        instaLink.style.display = 'inline-block';
        instaLink.style.textAlign = 'center';
        instaLink.style.margin = '20px auto 40px auto';
        instaLink.style.padding = '12px 24px';
        instaLink.style.backgroundColor = '#e4405f';
        instaLink.style.color = '#ffffff';
        instaLink.style.textDecoration = 'none';
        instaLink.style.fontSize = '1.1em';
        instaLink.style.borderRadius = '30px';
        instaLink.style.boxShadow = '0 2px 8px rgba(228,64,95,0.3)';
        instaLink.style.transition = 'all 0.3s ease';
        instaLink.style.cursor = 'pointer';
        
        // Set button text with additional text for specific sections
        let buttonHTML = '<i class="fab fa-instagram" style="margin-right: 8px;"></i>Follow & View more Updates in Instagram';
        if (title === 'Photos ABMC' || title === '3D Elevation Designing') {
            buttonHTML += '<br><span style="font-size: 0.9em; display: block; margin-top: 5px; color: #1e88e5; text-shadow: 0 1px 2px rgba(0,0,0,0.3); font-weight: bold;">Vishwakarma ABM Architects and Engineers</span>';
        } else if (title === 'Photos ABMS') {
            buttonHTML += '<br><span style="font-size: 0.9em; display: block; margin-top: 5px; color: #1e88e5; text-shadow: 0 1px 2px rgba(0,0,0,0.3); font-weight: bold;">ABM Land and Engineering Surveyors</span>';
        } else if (title === 'Structural Designing') {
            buttonHTML += '<br><span style="font-size: 0.9em; display: block; margin-top: 5px; color: #1e88e5; text-shadow: 0 1px 2px rgba(0,0,0,0.3); font-weight: bold;">Structural Engineering India</span>';
        }
        instaLink.innerHTML = buttonHTML;
        
        // Add hover effect
        instaLink.onmouseover = function() {
            this.style.transform = 'scale(1.05)';
            this.style.boxShadow = '0 4px 12px rgba(228,64,95,0.4)';
            this.style.backgroundColor = '#dc2b4c';
        };
        instaLink.onmouseout = function() {
            this.style.transform = 'scale(1)';
            this.style.boxShadow = '0 2px 8px rgba(228,64,95,0.3)';
            this.style.backgroundColor = '#e4405f';
        };

        // Create a container for center alignment
        const buttonContainer = document.createElement('div');
        buttonContainer.style.textAlign = 'center';
        buttonContainer.appendChild(instaLink);
        section.appendChild(buttonContainer);

        return section;
        images.forEach((src, i) => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = `${altPrefix} ${i + 1}`;
          grid.appendChild(img);
        });
        section.appendChild(grid);
        return section;
      }
      const gallerySections = document.getElementById('gallery-sections');
      gallerySections.innerHTML = '';
      gallerySections.appendChild(renderGallerySection('Photos ABMC', abmcImages, 'ABMC'));
      gallerySections.appendChild(renderGallerySection('Photos ABMS', abmsImages, 'ABMS'));
      gallerySections.appendChild(renderGallerySection('3D Elevation Designing', elevationImages, '3D Elevation'));
      gallerySections.appendChild(renderGallerySection('Structural Designing', structuralImages, 'Structural'));
    });
  </script>
</body>
</html>
